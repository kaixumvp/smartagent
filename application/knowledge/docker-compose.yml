services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    ports:
      # 5434 (not 5432/5433) so this stack runs alongside the business layer's
      # postgres (5432) and the Capability Registry's postgres (5433).
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # API on 9010, console on 9011 — clear of the Capability mock-server (:9000).
      - "9010:9000"
      - "9011:9001"
    volumes:
      - miniodata:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  backend:
    image: ${ACR_REGISTRY:-local/smartagent}:${KNOWLEDGE_IMAGE_TAG:-latest}-knowledge-backend
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://knowledge:knowledge@db:5432/knowledge
      OBJECT_STORE_TYPE: s3
      S3_ENDPOINT_URL: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: knowledge
      S3_SECURE: "false"
      QDRANT_URL: http://qdrant:6333
      EMBEDDER: ${EMBEDDER:-hash}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-256}
      EMBEDDING_URL: ${EMBEDDING_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      OCR_BACKEND: ${OCR_BACKEND:-none}
      RERANKER_BACKEND: ${RERANKER_BACKEND:-lexical}
      RERANKER_URL: ${RERANKER_URL:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      INTEGRATION_KEY: ${KNOWLEDGE_INTEGRATION_KEY:-}
    ports:
      # 8020 — clear of the business layer (8000) and Capability (8010).
      - "8020:8000"
    depends_on:
      - db
      - qdrant
      - minio

  frontend:
    image: ${ACR_REGISTRY:-local/smartagent}:${KNOWLEDGE_IMAGE_TAG:-latest}-knowledge-frontend
    build: ./frontend
    ports:
      # 3020 — clear of the console (3000) and Capability frontend (3010).
      - "3020:80"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  qdrantdata:
