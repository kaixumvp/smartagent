[project]
name = "knowledge-hub"
version = "0.2.0"
description = "Enterprise Knowledge Hub v0.1–v0.2: document ingest, hybrid retrieval"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "qdrant-client>=1.12",
    "httpx>=0.27",
    "minio>=7.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
ocr = ["pytesseract>=0.3", "pillow>=10.0"]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
