services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartagent}
      POSTGRES_DB: smartagent
    ports:
      - "${PLATFORM_DB_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartagent -d smartagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${PLATFORM_REDIS_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ${ACR_REGISTRY:-local}/platformagent-backend:${PLATFORM_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: platformagent/backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://smartagent:${POSTGRES_PASSWORD:-smartagent}@postgres:5432/smartagent
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${ACR_REGISTRY:-local}/platformagent-backend:${PLATFORM_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: platformagent/backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://smartagent:${POSTGRES_PASSWORD:-smartagent}@postgres:5432/smartagent
      REDIS_URL: redis://redis:6379/0
      CAPABILITY_REGISTRY_URL: ${CAPABILITY_REGISTRY_URL:-http://host.docker.internal:8010}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default: {}
      capability-internal:
        aliases:
          - platformagent-backend
    ports:
      - "${PLATFORM_API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ${ACR_REGISTRY:-local}/platformagent-frontend:${PLATFORM_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: platformagent/frontend/Dockerfile
    ports:
      - "${PLATFORM_BIND_ADDRESS:-127.0.0.1}:80:80"
    networks:
      default: {}
      public-gateway:
        aliases:
          - platformagent-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

networks:
  capability-internal:
    external: true
  public-gateway:
    external: true
