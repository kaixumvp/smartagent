[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "smartagent"
version = "0.1.0"
description = "SmartAgent V0.1 skeleton: single-agent multi-turn conversation + tool calling"
readme = "README.md"
license = "MIT"
packages = [{ include = "smartagent", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
ouroboros = { path = "../ouroboros", develop = true }
fastapi = ">=0.110"
uvicorn = { version = ">=0.29", extras = ["standard"] }
langgraph = ">=0.2"
litellm = ">=1.40"
sqlalchemy = { version = ">=2.0.25", extras = ["asyncio"] }
asyncpg = ">=0.29"
redis = ">=5.0"
pydantic = ">=2.6"
pydantic-settings = ">=2.2"
httpx = ">=0.27"
alembic = ">=1.13"
pyjwt = ">=2.8"
pgvector = ">=0.2.5"
scalar-fastapi = "^1.8.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
