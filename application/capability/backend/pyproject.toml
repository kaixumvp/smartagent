[project]
name = "capability-registry"
version = "0.3.0"
description = "Capability Registry backend for MCP tool manifests and provider sync"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "alembic>=1.13",
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "cryptography>=42",
]

[tool.poetry]
package-mode = false
