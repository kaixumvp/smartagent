services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registry}
      POSTGRES_DB: registry
    ports:
      # Host port shifted off 5432 so this stack can run alongside the business layer's
      # postgres (application/platformagent/backend/docker-compose.yml), which owns 5432.
      - "${CAPABILITY_DB_BIND_ADDRESS:-127.0.0.1}:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${ACR_REGISTRY:-local}/capability-backend:${CAPABILITY_IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    environment:
      MCP_AUTH_ENCRYPTION_KEY: ${MCP_AUTH_ENCRYPTION_KEY:-}
      CAPABILITY_INTEGRATION_KEY: ${CAPABILITY_INTEGRATION_KEY:-}
      DATABASE_URL: postgresql+psycopg2://registry:${POSTGRES_PASSWORD:-registry}@db:5432/registry
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
    ports:
      # Host port shifted off 8000, which is where the business layer's uvicorn runs.
      - "${CAPABILITY_BACKEND_BIND_ADDRESS:-127.0.0.1}:8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      default: {}
      capability-internal:
        aliases:
          - capability-backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # 6380 instead of 6379: the business layer's Redis owns 6379.
      - "${CAPABILITY_REDIS_BIND_ADDRESS:-127.0.0.1}:6380:6379"

  frontend:
    image: ${ACR_REGISTRY:-local}/capability-frontend:${CAPABILITY_IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    ports:
      # Loopback-only convenience port; public access goes through the PlatformAgent gateway.
      - "127.0.0.1:3010:80"
    depends_on:
      - backend
    networks:
      default: {}
      public-gateway:
        aliases:
          - capability-frontend

volumes:
  pgdata:

networks:
  capability-internal:
    external: true
  public-gateway:
    external: true
