[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ouroboros"
version = "1.1.0"
description = "Ouroboros: a business-agnostic agent runtime (Plan → Decide → Execute → Observe loop) with plugins, skills, tools, and memory."
readme = "README.md"
license = "MIT"
packages = [{ include = "src" }]
keywords = ["agent", "llm", "langgraph", "framework", "plugins", "skills", "tools", "memory"]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
langgraph = ">=0.2"
litellm = ">=1.40"
pydantic = ">=2.6"
httpx = ">=0.27"
redis = ">=5.0"
opentelemetry-api = { version = ">=1.20", optional = true }

[tool.poetry.extras]
observability = ["opentelemetry-api"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)-7s %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
