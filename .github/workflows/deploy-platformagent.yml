name: Deploy PlatformAgent to Aliyun ECS

on:
  push:
    branches:
      - main
    paths:
      - "application/platformagent/**"
      - "application/ouroboros/**"
      - ".github/workflows/deploy-platformagent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platformagent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build deployment images
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --tag "platformagent-backend:${GITHUB_SHA}" \
            --file application/platformagent/backend/Dockerfile \
            application
          docker build \
            --tag "platformagent-frontend:${GITHUB_SHA}" \
            --file application/platformagent/frontend/Dockerfile \
            application
          docker save "platformagent-backend:${GITHUB_SHA}" | gzip > "$RUNNER_TEMP/platformagent-backend.tar.gz"
          docker save "platformagent-frontend:${GITHUB_SHA}" | gzip > "$RUNNER_TEMP/platformagent-frontend.tar.gz"
          tar --exclude='platformagent/backend/.env' \
            -czf "$RUNNER_TEMP/platformagent-source.tar.gz" \
            -C application platformagent ouroboros

      - name: Configure SSH
        shell: bash
        env:
          ALIYUN_SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          ALIYUN_KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ALIYUN_SSH_PRIVATE_KEY"
          test -n "$ALIYUN_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ALIYUN_SSH_PRIVATE_KEY" > "$HOME/.ssh/platformagent_deploy"
          chmod 600 "$HOME/.ssh/platformagent_deploy"
          printf '%s\n' "$ALIYUN_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload and start services
        shell: bash
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_PORT: ${{ vars.ALIYUN_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$ALIYUN_HOST"
          test -n "$ALIYUN_USER"
          SSH_PORT="${ALIYUN_SSH_PORT:-22}"
          SSH=(ssh -i "$HOME/.ssh/platformagent_deploy" -p "$SSH_PORT" -o IdentitiesOnly=yes)
          SCP=(scp -i "$HOME/.ssh/platformagent_deploy" -P "$SSH_PORT" -o IdentitiesOnly=yes)
          TARGET="${ALIYUN_USER}@${ALIYUN_HOST}"
          PREFIX="platformagent-${GITHUB_SHA}"

          "${SSH[@]}" "$TARGET" "mkdir -p /opt/platformagent"
          "${SCP[@]}" "$RUNNER_TEMP/platformagent-source.tar.gz" "$TARGET:/tmp/${PREFIX}-source.tar.gz"
          "${SCP[@]}" "$RUNNER_TEMP/platformagent-backend.tar.gz" "$TARGET:/tmp/${PREFIX}-backend.tar.gz"
          "${SCP[@]}" "$RUNNER_TEMP/platformagent-frontend.tar.gz" "$TARGET:/tmp/${PREFIX}-frontend.tar.gz"
          "${SSH[@]}" "$TARGET" "bash -s -- '$PREFIX' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          prefix="$1"
          image_tag="$2"
          cd /opt/platformagent
          env_file="platformagent/backend/.env"
          test -f "$env_file" || {
            echo "Missing /opt/platformagent/platformagent/backend/.env; create it from .env.example first" >&2
            exit 1
          }
          grep -Eq '^PLATFORM_BIND_ADDRESS=127\.0\.0\.1$' "$env_file" || {
            echo "Set PLATFORM_BIND_ADDRESS=127.0.0.1 in $env_file" >&2
            exit 1
          }
          grep -Eq '^POSTGRES_PASSWORD=.+$' "$env_file" || {
            echo "Set POSTGRES_PASSWORD in $env_file" >&2
            exit 1
          }
          grep -Eq '^JWT_SECRET=.{32,}$' "$env_file" || {
            echo "Set a JWT_SECRET of at least 32 characters in $env_file" >&2
            exit 1
          }
          grep -Eq '^BOOTSTRAP_ADMIN_PASSWORD=.+$' "$env_file" || {
            echo "Set BOOTSTRAP_ADMIN_PASSWORD in $env_file" >&2
            exit 1
          }
          grep -Eq '^CAPABILITY_REGISTRY_URL=http://capability-backend:8000/?$' "$env_file" || {
            echo "Set CAPABILITY_REGISTRY_URL=http://capability-backend:8000 in $env_file" >&2
            exit 1
          }
          tar -xzf "/tmp/${prefix}-source.tar.gz" -C /opt/platformagent
          docker network inspect capability-internal >/dev/null 2>&1 || docker network create capability-internal
          docker load -i "/tmp/${prefix}-backend.tar.gz"
          docker load -i "/tmp/${prefix}-frontend.tar.gz"
          cd /opt/platformagent/platformagent/backend
          PLATFORM_IMAGE_TAG="$image_tag" docker compose up -d --remove-orphans
          docker compose ps
          rm -f "/tmp/${prefix}-source.tar.gz" \
            "/tmp/${prefix}-backend.tar.gz" \
            "/tmp/${prefix}-frontend.tar.gz"
          REMOTE
